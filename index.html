<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="index.css">
    <title>Bingo Master</title>
</head>
<body>
    <header>Bingo Master</header>
    
    <main class="container">
        <details class="opcoes-guia" open>
            <summary>⚙️ Configurações</summary>
            <div class="opcoes-content">
                <label class="switch-label">
                    <input type="checkbox" id="modo-auto" onchange="alternarModo()"> 
                    <span>Modo Automático</span>
                </label>
                
                <div class="controle-velocidade">
                    <span>Velocidade:</span>
                    <select id="velocidade">
                        <option value="3000">Lento</option>
                        <option value="1500" selected>Normal</option>
                        <option value="600">Rápido</option>
                    </select>
                </div>
            </div>
        </details>

        <div class="jogo">
            <div class="grupo-botoes">
                <button id="gerar" onclick="gerarCartela()">Nova Cartela</button>
                <button id="resetar" onclick="reiniciarJogo()">Reiniciar</button>
            </div>
            
            <div class="grupo-botoes">
                <button id="btn-auto" onclick="toggleAutoSorteio()">Iniciar Auto</button>
                <button id="sortear-um" onclick="sortearUm()">Sortear Manual</button>
            </div>

            <button id="gritar-bingo" onclick="gritarBingo()">📣 GRITAR BINGO! 📣</button>

            <section id="area-cartela">
                <div id="espaco-cartelas"></div>
            </section>
        </div>

        <div class="container-numeros">
            <h3>Sorteados:</h3>
            <div id="numeros-sorteados"></div>
        </div>
    </main>

    <footer>Desenvolvido por Arthur Jesus</footer>
    <audio id="som-sorteio" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Bingo Mobile</title>
</head>
<body>
    <header>Jogo de Bingo</header>
    
    <main class="container">
        <div class="jogo">
            <div class="grupo-botoes">
                <button id="gerar" onclick="gerarCartela()">Gerar Cartela</button>
                <button id="resetar" onclick="reiniciarJogo()">Reiniciar</button>
            </div>
            
            <div class="grupo-botoes">
                <button id="iniciar" onclick="iniciarJogo()">Auto</button>
                <button id="sortear-um" onclick="sortearUm()">Sortear</button>
            </div>

            <section id="area-cartela">
                <div id="espaco-cartelas"></div>
            </section>
        </div>

        <div class="container-numeros">
            <h2>Números Sorteados:</h2>
            <div id="numeros-sorteados"></div>
        </div>
    </main>

    <footer>Desenvolvido por Arthur Jesus</footer>

    <audio id="som-sorteio" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <script src="index.js"></script>
</body>
</html>
